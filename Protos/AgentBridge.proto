// AgentBridge gRPC Service Definition
// Copyright 2024. Licensed under MIT.
//
// This proto defines the gRPC interface for AI agent interaction with Unreal Engine.
// Designed for compatibility with Tempo's TempoScripting infrastructure.
//
// Phase 2 Integration Note:
// When integrating with TempoScripting, replace the Geometry messages below with:
//   import "TempoScripting/Geometry.proto";
// And use TempoScripting.Vector, TempoScripting.Rotation, TempoScripting.Transform

syntax = "proto3";

package AgentBridge;

// NOTE: In Phase 2, import these from TempoScripting instead:
// import "TempoScripting/Empty.proto";
// import "TempoScripting/Geometry.proto";

//=============================================================================
// Common Types (will be replaced by TempoScripting imports in Phase 2)
//=============================================================================

message Empty {}

message Vector {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Rotation {
  double pitch = 1;  // P (degrees)
  double yaw = 2;    // Y (degrees)
  double roll = 3;   // R (degrees)
}

message Transform {
  Vector location = 1;
  Rotation rotation = 2;
  Vector scale = 3;
}

message Color {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
  int32 a = 4;
}

//=============================================================================
// Property Value - Generic property container for cross-language transport
//=============================================================================

enum PropertyType {
  PROPERTY_TYPE_NONE = 0;
  PROPERTY_TYPE_BOOL = 1;
  PROPERTY_TYPE_INT = 2;
  PROPERTY_TYPE_FLOAT = 3;
  PROPERTY_TYPE_STRING = 4;
  PROPERTY_TYPE_NAME = 5;
  PROPERTY_TYPE_VECTOR = 6;
  PROPERTY_TYPE_ROTATOR = 7;
  PROPERTY_TYPE_TRANSFORM = 8;
  PROPERTY_TYPE_COLOR = 9;
  PROPERTY_TYPE_OBJECT = 10;
  PROPERTY_TYPE_CLASS = 11;
  PROPERTY_TYPE_STRUCT = 12;
  PROPERTY_TYPE_ARRAY = 13;
  PROPERTY_TYPE_MAP = 14;
  PROPERTY_TYPE_ENUM = 15;
}

message PropertyValue {
  PropertyType type = 1;

  // Primitive values (use appropriate field based on type)
  bool bool_value = 2;
  int64 int_value = 3;
  double float_value = 4;
  string string_value = 5;

  // Compound values
  Vector vector_value = 6;
  Rotation rotation_value = 7;
  Transform transform_value = 8;
  Color color_value = 9;

  // Object reference (path string)
  string object_path = 10;

  // Container values
  repeated PropertyValue array_values = 11;
  map<string, PropertyValue> struct_values = 12;

  // Enum value (name + numeric value)
  string enum_name = 13;
  int32 enum_value = 14;
}

//=============================================================================
// World Operations
//=============================================================================

message WorldInfo {
  string world_type = 1;        // "Editor", "PIE", "Game"
  string world_name = 2;
  int32 pie_instance = 3;       // -1 if not PIE
  bool has_begun_play = 4;
  int32 actor_count = 5;
  bool is_current_target = 6;
}

message ListWorldsRequest {}

message ListWorldsResponse {
  repeated WorldInfo worlds = 1;
  int32 current_world_index = 2;
}

message SetTargetWorldRequest {
  string world_identifier = 1;  // Index, name, or "editor"/"pie"
}

//=============================================================================
// Actor Discovery
//=============================================================================

message ActorDescriptor {
  string guid = 1;
  string path = 2;
  string name = 3;
  string label = 4;             // Editor display name
  string class_name = 5;
  Transform transform = 6;
  bool is_hidden = 7;
  string parent_actor_id = 8;   // Empty if no parent
}

message ActorDetails {
  ActorDescriptor descriptor = 1;
  map<string, PropertyValue> properties = 2;
  repeated ComponentDescriptor components = 3;
  repeated string tags = 4;
  string folder_path = 5;       // World Outliner folder
}

message ComponentDescriptor {
  string name = 1;
  string class_name = 2;
  bool is_scene_component = 3;
  Transform relative_transform = 4;  // Only for scene components
  string parent_component = 5;       // Attachment parent
}

message QueryActorsRequest {
  string class_name = 1;        // Filter by class (empty = all)
  string name_pattern = 2;      // Wildcard pattern for name/label
  string tag = 3;               // Filter by actor tag
  int32 limit = 4;              // Max results (0 = use default)
  bool include_hidden = 5;
}

message QueryActorsResponse {
  repeated ActorDescriptor actors = 1;
  int32 total_count = 2;        // May be > actors.size() due to limit
}

message GetActorRequest {
  string actor_id = 1;          // Name, label, path, or GUID
  bool include_properties = 2;
  bool include_components = 3;
  int32 property_depth = 4;     // Max recursion for nested properties
}

message GetActorResponse {
  ActorDetails actor = 1;
}

//=============================================================================
// Actor Manipulation
//=============================================================================

message SpawnActorRequest {
  string class_name = 1;
  Transform transform = 2;
  string label = 3;             // Editor display name
  string folder_path = 4;       // World Outliner folder
  map<string, PropertyValue> initial_properties = 5;
  bool deferred = 6;            // Defer BeginPlay until FinishSpawning
}

message SpawnActorResponse {
  ActorDescriptor spawned_actor = 1;
}

message DeleteActorRequest {
  string actor_id = 1;
}

message DeleteActorsRequest {
  repeated string actor_ids = 1;
}

message DeleteActorsResponse {
  int32 deleted_count = 1;
  repeated string failed_ids = 2;
  repeated string error_messages = 3;
}

message DuplicateActorRequest {
  string actor_id = 1;
  Transform new_transform = 2;
  string new_label = 3;
}

message DuplicateActorResponse {
  ActorDescriptor duplicated_actor = 1;
}

message SetActorTransformRequest {
  string actor_id = 1;
  Transform transform = 2;
  bool sweep = 3;               // Check for collision
  bool teleport = 4;            // Reset physics
}

message SetActorPropertiesRequest {
  string actor_id = 1;
  map<string, PropertyValue> properties = 2;
}

message SetActorPropertiesResponse {
  int32 properties_set = 1;
  repeated string failed_properties = 2;
  repeated string error_messages = 3;
}

message SetActorLabelRequest {
  string actor_id = 1;
  string new_label = 2;
}

message SetActorFolderRequest {
  string actor_id = 1;
  string folder_path = 2;
}

message AttachActorRequest {
  string actor_id = 1;
  string parent_actor_id = 2;   // Empty to detach
  string socket_name = 3;       // Optional socket
  bool weld_simulated_bodies = 4;
}

//=============================================================================
// Component Operations
//=============================================================================

message GetComponentsRequest {
  string actor_id = 1;
  string class_filter = 2;      // Filter by component class
}

message GetComponentsResponse {
  repeated ComponentDescriptor components = 1;
}

message GetComponentPropertiesRequest {
  string actor_id = 1;
  string component_name = 2;
  repeated string property_names = 3;  // Empty = all properties
}

message GetComponentPropertiesResponse {
  map<string, PropertyValue> properties = 1;
}

message SetComponentPropertiesRequest {
  string actor_id = 1;
  string component_name = 2;
  map<string, PropertyValue> properties = 3;
}

message SetComponentTransformRequest {
  string actor_id = 1;
  string component_name = 2;
  Transform transform = 3;
  bool world_space = 4;         // true = world, false = relative
}

message AddComponentRequest {
  string actor_id = 1;
  string class_name = 2;
  string component_name = 3;
  string parent_component = 4;  // Attachment parent (scene components)
  Transform relative_transform = 5;
}

message AddComponentResponse {
  ComponentDescriptor component = 1;
}

message RemoveComponentRequest {
  string actor_id = 1;
  string component_name = 2;
}

//=============================================================================
// Property Path Operations
//=============================================================================

message GetPropertyPathRequest {
  string actor_id = 1;
  string path = 2;              // e.g., "RootComponent.RelativeLocation.X"
}

message GetPropertyPathResponse {
  PropertyValue value = 1;
  string type_name = 2;         // Detailed type string
}

message SetPropertyPathRequest {
  string actor_id = 1;
  string path = 2;
  PropertyValue value = 3;
}

//=============================================================================
// Function Invocation
//=============================================================================

message ParameterInfo {
  string name = 1;
  string type_name = 2;
  PropertyType type = 3;
  bool is_out_param = 4;
  bool is_return_value = 5;
  PropertyValue default_value = 6;
}

message FunctionSignature {
  string function_name = 1;
  string description = 2;
  repeated ParameterInfo parameters = 3;
  ParameterInfo return_value = 4;
  bool is_static = 5;
  bool is_blueprint_callable = 6;
  bool is_pure = 7;
  bool needs_world_context = 8;
}

message CallFunctionRequest {
  string actor_id = 1;          // Empty for static functions
  string class_name = 2;        // Required for static functions
  string function_name = 3;
  map<string, PropertyValue> parameters = 4;
}

message CallFunctionResponse {
  PropertyValue return_value = 1;
  map<string, PropertyValue> out_parameters = 2;
}

message GetFunctionSignatureRequest {
  string class_name = 1;
  string function_name = 2;
}

message GetFunctionSignatureResponse {
  FunctionSignature signature = 1;
}

message ListFunctionsRequest {
  string class_name = 1;
  bool include_inherited = 2;
  bool blueprint_callable_only = 3;
}

message ListFunctionsResponse {
  repeated FunctionSignature functions = 1;
}

//=============================================================================
// Type Discovery
//=============================================================================

message PropertyInfo {
  string name = 1;
  string display_name = 2;
  string type_name = 3;
  PropertyType type = 4;
  bool is_read_only = 5;
  bool is_blueprint_visible = 6;
  string category = 7;
  string description = 8;
}

message ClassInfo {
  string class_name = 1;
  string display_name = 2;
  string class_path = 3;
  string parent_class_name = 4;
  bool is_blueprint = 5;
  bool is_abstract = 6;
  bool is_placeable = 7;
  repeated string implemented_interfaces = 8;
}

message ClassSchema {
  ClassInfo class_info = 1;
  repeated PropertyInfo properties = 2;
  repeated FunctionSignature functions = 3;
}

message FindClassRequest {
  string class_name = 1;        // Name, display name, or path
}

message FindClassResponse {
  ClassInfo class_info = 1;
}

message GetClassSchemaRequest {
  string class_name = 1;
  bool include_inherited = 2;
  bool include_functions = 3;
}

message GetClassSchemaResponse {
  ClassSchema schema = 1;
}

message ListClassesRequest {
  string base_class_name = 1;   // Filter by base class (empty = AActor)
  string name_pattern = 2;      // Wildcard pattern
  bool include_blueprint = 3;
  bool include_abstract = 4;
  int32 limit = 5;
}

message ListClassesResponse {
  repeated ClassInfo classes = 1;
  int32 total_count = 2;
}

//=============================================================================
// Batch Operations
//=============================================================================

message BatchCommand {
  string command_id = 1;        // For correlation

  oneof command {
    QueryActorsRequest query_actors = 10;
    GetActorRequest get_actor = 11;
    SpawnActorRequest spawn_actor = 12;
    DeleteActorRequest delete_actor = 13;
    SetActorTransformRequest set_transform = 14;
    SetActorPropertiesRequest set_properties = 15;
    GetPropertyPathRequest get_property_path = 16;
    SetPropertyPathRequest set_property_path = 17;
    CallFunctionRequest call_function = 18;
    DuplicateActorRequest duplicate_actor = 19;
  }
}

message BatchResult {
  string command_id = 1;
  bool success = 2;
  string error_message = 3;

  oneof result {
    QueryActorsResponse query_actors_result = 10;
    GetActorResponse get_actor_result = 11;
    SpawnActorResponse spawn_actor_result = 12;
    Empty delete_actor_result = 13;
    Empty set_transform_result = 14;
    SetActorPropertiesResponse set_properties_result = 15;
    GetPropertyPathResponse get_property_path_result = 16;
    Empty set_property_path_result = 17;
    CallFunctionResponse call_function_result = 18;
    DuplicateActorResponse duplicate_actor_result = 19;
  }
}

message BatchRequest {
  repeated BatchCommand commands = 1;
  bool stop_on_error = 2;
  bool use_transaction = 3;     // Wrap in undo transaction
}

message BatchResponse {
  repeated BatchResult results = 1;
  int32 first_failed_index = 2; // -1 if all succeeded
  bool transaction_committed = 3;
}

//=============================================================================
// Streaming / Subscriptions
//=============================================================================

enum EventType {
  EVENT_TYPE_NONE = 0;
  EVENT_TYPE_ACTOR_SPAWNED = 1;
  EVENT_TYPE_ACTOR_DESTROYED = 2;
  EVENT_TYPE_ACTOR_MOVED = 3;
  EVENT_TYPE_PROPERTY_CHANGED = 4;
  EVENT_TYPE_WORLD_CHANGED = 5;
  EVENT_TYPE_SELECTION_CHANGED = 6;
}

message SubscribeRequest {
  repeated EventType event_types = 1;
  string actor_filter = 2;      // Only events for matching actors
  string class_filter = 3;      // Only events for actors of class
}

message StreamEvent {
  EventType event_type = 1;
  double timestamp = 2;

  oneof event_data {
    ActorDescriptor actor_spawned = 10;
    string actor_destroyed_id = 11;
    ActorDescriptor actor_moved = 12;
    PropertyChangeEvent property_changed = 13;
    WorldChangeEvent world_changed = 14;
    SelectionChangeEvent selection_changed = 15;
  }
}

message PropertyChangeEvent {
  string actor_id = 1;
  string property_path = 2;
  PropertyValue old_value = 3;
  PropertyValue new_value = 4;
}

message WorldChangeEvent {
  string event_subtype = 1;     // "level_loaded", "pie_started", etc.
  WorldInfo world_info = 2;
}

message SelectionChangeEvent {
  repeated string selected_actor_ids = 1;
}

//=============================================================================
// AgentBridge Service Definition
//=============================================================================

service AgentBridgeService {
  //--- World Operations ---
  rpc ListWorlds(ListWorldsRequest) returns (ListWorldsResponse);
  rpc SetTargetWorld(SetTargetWorldRequest) returns (Empty);

  //--- Actor Discovery ---
  rpc QueryActors(QueryActorsRequest) returns (QueryActorsResponse);
  rpc GetActor(GetActorRequest) returns (GetActorResponse);

  //--- Actor Manipulation ---
  rpc SpawnActor(SpawnActorRequest) returns (SpawnActorResponse);
  rpc DeleteActor(DeleteActorRequest) returns (Empty);
  rpc DeleteActors(DeleteActorsRequest) returns (DeleteActorsResponse);
  rpc DuplicateActor(DuplicateActorRequest) returns (DuplicateActorResponse);
  rpc SetActorTransform(SetActorTransformRequest) returns (Empty);
  rpc SetActorProperties(SetActorPropertiesRequest) returns (SetActorPropertiesResponse);
  rpc SetActorLabel(SetActorLabelRequest) returns (Empty);
  rpc SetActorFolder(SetActorFolderRequest) returns (Empty);
  rpc AttachActor(AttachActorRequest) returns (Empty);

  //--- Component Operations ---
  rpc GetComponents(GetComponentsRequest) returns (GetComponentsResponse);
  rpc GetComponentProperties(GetComponentPropertiesRequest) returns (GetComponentPropertiesResponse);
  rpc SetComponentProperties(SetComponentPropertiesRequest) returns (Empty);
  rpc SetComponentTransform(SetComponentTransformRequest) returns (Empty);
  rpc AddComponent(AddComponentRequest) returns (AddComponentResponse);
  rpc RemoveComponent(RemoveComponentRequest) returns (Empty);

  //--- Property Path Operations ---
  rpc GetPropertyPath(GetPropertyPathRequest) returns (GetPropertyPathResponse);
  rpc SetPropertyPath(SetPropertyPathRequest) returns (Empty);

  //--- Function Invocation ---
  rpc CallFunction(CallFunctionRequest) returns (CallFunctionResponse);
  rpc GetFunctionSignature(GetFunctionSignatureRequest) returns (GetFunctionSignatureResponse);
  rpc ListFunctions(ListFunctionsRequest) returns (ListFunctionsResponse);

  //--- Type Discovery ---
  rpc FindClass(FindClassRequest) returns (FindClassResponse);
  rpc GetClassSchema(GetClassSchemaRequest) returns (GetClassSchemaResponse);
  rpc ListClasses(ListClassesRequest) returns (ListClassesResponse);

  //--- Batch Operations ---
  rpc ExecuteBatch(BatchRequest) returns (BatchResponse);

  //--- Streaming ---
  rpc Subscribe(SubscribeRequest) returns (stream StreamEvent);
}
