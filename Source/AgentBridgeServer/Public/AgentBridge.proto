// Tempo-integrated gRPC interface for AI agent interaction with Unreal Engine.

syntax = "proto3";

import "TempoScripting/Empty.proto";
import "TempoScripting/Geometry.proto";

//=============================================================================
// Extended Geometry Types (not in TempoScripting)
//=============================================================================

message Scale {
  double x = 1;
  double y = 2;
  double z = 3;
}

message ActorTransform {
  TempoScripting.Vector location = 1;
  TempoScripting.Rotation rotation = 2;
  Scale scale = 3;
}

message Color {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
  int32 a = 4;
}

//=============================================================================
// Property Value - Generic property container for cross-language transport
//=============================================================================

enum PropertyType {
  PROPERTY_TYPE_NONE = 0;
  PROPERTY_TYPE_BOOL = 1;
  PROPERTY_TYPE_INT = 2;
  PROPERTY_TYPE_FLOAT = 3;
  PROPERTY_TYPE_STRING = 4;
  PROPERTY_TYPE_NAME = 5;
  PROPERTY_TYPE_VECTOR = 6;
  PROPERTY_TYPE_ROTATOR = 7;
  PROPERTY_TYPE_TRANSFORM = 8;
  PROPERTY_TYPE_COLOR = 9;
  PROPERTY_TYPE_OBJECT = 10;
  PROPERTY_TYPE_CLASS = 11;
  PROPERTY_TYPE_STRUCT = 12;
  PROPERTY_TYPE_ARRAY = 13;
  PROPERTY_TYPE_MAP = 14;
  PROPERTY_TYPE_ENUM = 15;
}

message PropertyValue {
  PropertyType type = 1;

  // Primitive values (use appropriate field based on type)
  bool bool_value = 2;
  int64 int_value = 3;
  double float_value = 4;
  string string_value = 5;

  // Compound values
  TempoScripting.Vector vector_value = 6;
  TempoScripting.Rotation rotation_value = 7;
  ActorTransform transform_value = 8;
  Color color_value = 9;

  // Object reference (path string)
  string object_path = 10;

  // Container values
  repeated PropertyValue array_values = 11;
  // Note: struct_values uses repeated KeyValuePair instead of map due to protobuf/tempo compatibility
  repeated PropertyKeyValue struct_values = 12;

  // Enum value (name + numeric value)
  string enum_name = 13;
  int32 enum_value = 14;
}

message PropertyKeyValue {
  string key = 1;
  PropertyValue value = 2;
}

//=============================================================================
// World Operations
//=============================================================================

message WorldInfo {
  string world_type = 1;        // "Editor", "PIE", "Game"
  string world_name = 2;
  int32 pie_instance = 3;       // -1 if not PIE
  bool has_begun_play = 4;
  int32 actor_count = 5;
  bool is_current_target = 6;
}

message ListWorldsRequest {}

message ListWorldsResponse {
  repeated WorldInfo worlds = 1;
  int32 current_world_index = 2;
}

message SetTargetWorldRequest {
  string world_identifier = 1;  // Index, name, or "editor"/"pie"
}

//=============================================================================
// Actor Discovery
//=============================================================================

message ActorDescriptor {
  string guid = 1;
  string path = 2;
  string name = 3;
  string label = 4;             // Editor display name
  string class_name = 5;
  ActorTransform transform = 6;
  bool is_hidden = 7;
  string parent_actor_id = 8;   // Empty if no parent
}

message QueryActorsRequest {
  string class_name = 1;        // Filter by class (empty = all)
  string name_pattern = 2;      // Wildcard pattern for name/label
  string tag = 3;               // Filter by actor tag
  int32 limit = 4;              // Max results (0 = use default)
  bool include_hidden = 5;
}

message QueryActorsResponse {
  repeated ActorDescriptor actors = 1;
  int32 total_count = 2;        // May be > actors.size() due to limit
}

message GetActorRequest {
  string actor_id = 1;          // Name, label, path, or GUID
  bool include_properties = 2;
  bool include_components = 3;
  int32 property_depth = 4;     // Max recursion for nested properties
}

message ActorDetails {
  ActorDescriptor actor_info = 1;
  repeated PropertyKeyValue properties = 2;
  repeated ComponentDescriptor components = 3;
  repeated string tags = 4;
  string folder_path = 5;       // World Outliner folder
}

message GetActorResponse {
  ActorDetails actor = 1;
}

message ComponentDescriptor {
  string name = 1;
  string class_name = 2;
  bool is_scene_component = 3;
  ActorTransform relative_transform = 4;  // Only for scene components
  string parent_component = 5;            // Attachment parent
}

//=============================================================================
// Actor Manipulation
//=============================================================================

message SpawnActorRequest {
  string class_name = 1;
  ActorTransform transform = 2;
  string label = 3;             // Editor display name
  string folder_path = 4;       // World Outliner folder
  repeated PropertyKeyValue initial_properties = 5;
  bool deferred = 6;            // Defer BeginPlay until FinishSpawning
}

message SpawnActorResponse {
  ActorDescriptor spawned_actor = 1;
}

message DeleteActorRequest {
  string actor_id = 1;
}

message SetActorTransformRequest {
  string actor_id = 1;
  ActorTransform transform = 2;
  bool sweep = 3;               // Check for collision
  bool teleport = 4;            // Reset physics
}

message SetActorPropertiesRequest {
  string actor_id = 1;
  repeated PropertyKeyValue properties = 2;
}

message SetActorPropertiesResponse {
  int32 properties_set = 1;
  repeated string failed_properties = 2;
  repeated string error_messages = 3;
}

//=============================================================================
// Property Path Operations
//=============================================================================

message GetPropertyPathRequest {
  string actor_id = 1;
  string path = 2;              // e.g., "RootComponent.RelativeLocation.X"
}

message GetPropertyPathResponse {
  PropertyValue value = 1;
  string type_name = 2;         // Detailed type string
}

message SetPropertyPathRequest {
  string actor_id = 1;
  string path = 2;
  PropertyValue value = 3;
}

//=============================================================================
// Function Invocation
//=============================================================================

message CallFunctionRequest {
  string actor_id = 1;          // Empty for static functions
  string class_name = 2;        // Required for static functions
  string function_name = 3;
  repeated PropertyKeyValue parameters = 4;
}

message CallFunctionResponse {
  PropertyValue return_value = 1;
  repeated PropertyKeyValue out_parameters = 2;
}

//=============================================================================
// Type Discovery
//=============================================================================

message PropertyInfo {
  string name = 1;
  string display_name = 2;
  string type_name = 3;
  PropertyType type = 4;
  bool is_read_only = 5;
  bool is_blueprint_visible = 6;
  string category = 7;
  string description = 8;
}

message ClassInfo {
  string class_name = 1;
  string display_name = 2;
  string class_path = 3;
  string parent_class_name = 4;
  bool is_blueprint = 5;
  bool is_abstract = 6;
  bool is_placeable = 7;
  repeated string implemented_interfaces = 8;
}

message FindClassRequest {
  string class_name = 1;        // Name, display name, or path
}

message FindClassResponse {
  ClassInfo class_info = 1;
}

message ListClassesRequest {
  string base_class_name = 1;   // Filter by base class (empty = AActor)
  string name_pattern = 2;      // Wildcard pattern
  bool include_blueprint = 3;
  bool include_abstract = 4;
  int32 limit = 5;
}

message ListClassesResponse {
  repeated ClassInfo classes = 1;
  int32 total_count = 2;
}

message GetClassSchemaRequest {
  string class_name = 1;
  bool include_inherited = 2;
  bool include_functions = 3;
}

message FunctionSignature {
  string function_name = 1;
  string description = 2;
  repeated PropertyInfo parameters = 3;
  PropertyInfo return_value = 4;
  bool is_static = 5;
  bool is_blueprint_callable = 6;
  bool is_pure = 7;
  bool needs_world_context = 8;
}

message ClassSchema {
  ClassInfo class_info = 1;
  repeated PropertyInfo properties = 2;
  repeated FunctionSignature functions = 3;
}

message GetClassSchemaResponse {
  ClassSchema schema = 1;
}

//=============================================================================
// World Partition & Streaming
//=============================================================================

enum StreamingState {
  STREAMING_STATE_NOT_APPLICABLE = 0;  // Not a WP world
  STREAMING_STATE_LOADED = 1;          // Actor is loaded in memory
  STREAMING_STATE_UNLOADED = 2;        // Actor metadata only, not loaded
  STREAMING_STATE_INVALID = 3;         // Actor doesn't exist
}

message BoundingBox {
  TempoScripting.Vector min = 1;
  TempoScripting.Vector max = 2;
}

message StreamingActorInfo {
  ActorDescriptor actor_info = 1;
  StreamingState streaming_state = 2;
  string streaming_cell = 3;           // Cell/region name
  BoundingBox bounds = 4;              // Editor bounds (available even when unloaded)
  repeated string data_layers = 5;
  bool is_spatially_loaded = 6;
}

message IsWorldPartitionedRequest {}

message IsWorldPartitionedResponse {
  bool is_partitioned = 1;
  string world_name = 2;
}

message QueryAllActorsRequest {
  string class_name = 1;               // Filter by class (empty = all)
  string name_pattern = 2;             // Wildcard pattern
  bool include_loaded = 3;             // Include loaded actors (default: true)
  bool include_unloaded = 4;           // Include unloaded actors (default: true)
  string data_layer = 5;               // Filter by data layer
  BoundingBox bounds_filter = 6;       // Spatial filter
  int32 limit = 7;
}

message QueryAllActorsResponse {
  repeated StreamingActorInfo actors = 1;
  int32 total_loaded = 2;
  int32 total_unloaded = 3;
}

message GetStreamingStateRequest {
  string actor_guid = 1;               // Actor GUID
}

message GetStreamingStateResponse {
  StreamingState state = 1;
  StreamingActorInfo actor = 2;        // Full info if available
}

message QueryLandscapeRequest {
  bool include_unloaded = 1;
}

message QueryLandscapeResponse {
  repeated StreamingActorInfo landscape_proxies = 1;
  int32 total_count = 2;
}

message GetLandscapeBoundsRequest {}

message GetLandscapeBoundsResponse {
  bool valid = 1;                      // Whether valid bounds were found
  TempoScripting.Vector min = 2;       // Minimum corner of bounding box
  TempoScripting.Vector max = 3;       // Maximum corner of bounding box
  TempoScripting.Vector center = 4;    // Center point of landscape
  TempoScripting.Vector extent = 5;    // Half-extents (distance from center to edge)
  int32 proxy_count = 6;               // Number of landscape proxies sampled
  string landscape_name = 7;           // Name of the main landscape actor
}

message GetDataLayersRequest {}

message GetDataLayersResponse {
  repeated string data_layers = 1;
}

message GetActorsInDataLayerRequest {
  string data_layer = 1;
  bool include_unloaded = 2;
  int32 limit = 3;
}

message GetActorsInDataLayerResponse {
  repeated StreamingActorInfo actors = 1;
  int32 total_count = 2;
}

message ExecuteConsoleCommandRequest {
  string command = 1;                  // Console command to execute
}

message ExecuteConsoleCommandResponse {
  bool success = 1;
  string output = 2;                   // Command output (if available)
}

//=============================================================================
// Console Command Discovery
//=============================================================================

message ConsoleCommandInfo {
  string name = 1;                     // Command/CVar name
  string help = 2;                     // Help/description text
  bool is_variable = 3;                // True if CVar, false if command
  string value_type = 4;               // "Int", "Float", "String", "Bool", "" for commands
  string current_value = 5;            // Current value (for CVars only)
}

message SearchConsoleCommandsRequest {
  string keyword = 1;                  // Search term
  int32 limit = 2;                     // Max results (default: 50)
  bool search_help = 3;                // Also search in help text
  int32 offset = 4;                    // Skip first N matches (for pagination)
}

message SearchConsoleCommandsResponse {
  repeated ConsoleCommandInfo commands = 1;
  int32 total_scanned = 2;             // Total console objects checked
  int32 total_matches = 3;             // Total matches found (before limit/offset)
}

//=============================================================================
// Asset Operations (P0)
//=============================================================================

message CreateAssetRequest {
  string asset_class = 1;              // Class name (e.g., "DataAsset", "MaterialInstanceConstant")
  string package_path = 2;             // Content folder path (e.g., "/Game/MyAssets")
  string asset_name = 3;               // Asset name
  string parent_asset_path = 4;        // For instances (e.g., parent material path)
  repeated PropertyKeyValue properties = 5;  // Initial properties
}

message CreateAssetResponse {
  bool success = 1;
  string error_message = 2;
  string asset_path = 3;               // Full asset path (e.g., "/Game/MyAssets/NewAsset")
  string asset_class = 4;              // Actual class name
}

message SaveAssetRequest {
  string asset_path = 1;               // Asset to save
  bool prompt_for_checkout = 2;        // Source control checkout prompt
}

message SaveAssetResponse {
  bool success = 1;
  string error_message = 2;
  string file_path = 3;                // Saved file path on disk
}

message SaveActorAsBlueprintRequest {
  string actor_id = 1;                 // Actor to save
  string package_path = 2;             // Content folder path
  string blueprint_name = 3;           // Blueprint name
  bool replace_existing = 4;           // Overwrite if exists
}

message SaveActorAsBlueprintResponse {
  bool success = 1;
  string error_message = 2;
  string blueprint_path = 3;           // Created blueprint path
}

message DuplicateAssetRequest {
  string source_path = 1;              // Asset to duplicate
  string dest_package_path = 2;        // Destination folder
  string dest_asset_name = 3;          // New asset name
}

message DuplicateAssetResponse {
  bool success = 1;
  string error_message = 2;
  string new_asset_path = 3;           // Duplicated asset path
}

message GetAssetThumbnailRequest {
  string asset_path = 1;               // Asset to get thumbnail for
  int32 width = 2;                     // Thumbnail width (default: 256)
  int32 height = 3;                    // Thumbnail height (default: 256)
}

message GetAssetThumbnailResponse {
  bool success = 1;
  string error_message = 2;
  bytes image_data = 3;                // PNG image data
  int32 width = 4;
  int32 height = 5;
}

//=============================================================================
// Component Operations (P1)
//=============================================================================

enum AttachmentRule {
  ATTACHMENT_RULE_KEEP_RELATIVE = 0;
  ATTACHMENT_RULE_KEEP_WORLD = 1;
  ATTACHMENT_RULE_SNAP_TO_TARGET = 2;
}

message GetComponentTransformRequest {
  string actor_id = 1;
  string component_name = 2;
  bool world_space = 3;                // True for world, false for relative
}

message GetComponentTransformResponse {
  bool success = 1;
  string error_message = 2;
  ActorTransform transform = 3;
}

message SetComponentTransformRequest {
  string actor_id = 1;
  string component_name = 2;
  ActorTransform transform = 3;
  bool world_space = 4;                // True for world, false for relative
  bool sweep = 5;                      // Collision sweep
}

message AttachComponentRequest {
  string actor_id = 1;
  string component_name = 2;           // Component to attach
  string parent_component_name = 3;    // Attach to this (default: root)
  string socket_name = 4;              // Optional socket
  AttachmentRule location_rule = 5;
  AttachmentRule rotation_rule = 6;
  AttachmentRule scale_rule = 7;
}

message AttachActorRequest {
  string child_actor_id = 1;           // Actor to attach
  string parent_actor_id = 2;          // Attach to this actor
  string parent_component_name = 3;    // Specific component (default: root)
  string socket_name = 4;              // Optional socket
  AttachmentRule location_rule = 5;
  AttachmentRule rotation_rule = 6;
  AttachmentRule scale_rule = 7;
}

message DetachComponentRequest {
  string actor_id = 1;
  string component_name = 2;
  bool maintain_world_position = 3;
}

message DetachActorRequest {
  string actor_id = 1;
  bool maintain_world_position = 2;
}

//=============================================================================
// File Operations (P1) - Constrained to project directory
//=============================================================================

message ReadProjectFileRequest {
  string relative_path = 1;            // Path relative to project root
  bool as_base64 = 2;                  // Return binary as base64
  int64 max_bytes = 3;                 // Max bytes to read (0 = all)
}

message ReadProjectFileResponse {
  bool success = 1;
  string error_message = 2;
  string content = 3;                  // File content (text or base64)
  int64 file_size = 4;
  bool is_binary = 5;                  // True if base64 encoded
}

message WriteProjectFileRequest {
  string relative_path = 1;            // Path relative to project root
  string content = 2;                  // Content to write
  bool is_base64 = 3;                  // Content is base64 encoded
  bool create_directories = 4;         // Create parent dirs
  bool append = 5;                     // Append instead of overwrite
}

message WriteProjectFileResponse {
  bool success = 1;
  string error_message = 2;
  int64 bytes_written = 3;
}

message FileInfo {
  string name = 1;
  string relative_path = 2;
  bool is_directory = 3;
  int64 size = 4;
  string last_modified = 5;            // ISO8601 timestamp
}

message ListProjectDirectoryRequest {
  string relative_path = 1;            // Path relative to project root
  string pattern = 2;                  // Glob pattern (e.g., "*.uasset")
  bool recursive = 3;                  // Include subdirectories
  int32 limit = 4;                     // Max files to return
}

message ListProjectDirectoryResponse {
  bool success = 1;
  string error_message = 2;
  repeated FileInfo files = 3;
  int32 total_count = 4;               // Total matching (may exceed limit)
}

message CopyProjectFileRequest {
  string source_path = 1;              // Source relative path
  string dest_path = 2;                // Destination relative path
  bool overwrite = 3;                  // Overwrite if exists
}

message CopyProjectFileResponse {
  bool success = 1;
  string error_message = 2;
  string dest_full_path = 3;           // Full destination path
}

message DeleteProjectFileRequest {
  string relative_path = 1;
  bool allow_directory_delete = 2;     // Allow deleting directories
}

//=============================================================================
// AgentBridge Service Definition
//=============================================================================

service AgentBridgeService {
  //--- World Operations ---
  rpc ListWorlds(ListWorldsRequest) returns (ListWorldsResponse);
  rpc SetTargetWorld(SetTargetWorldRequest) returns (TempoScripting.Empty);

  //--- Actor Discovery ---
  rpc QueryActors(QueryActorsRequest) returns (QueryActorsResponse);
  rpc GetActor(GetActorRequest) returns (GetActorResponse);

  //--- Actor Manipulation ---
  rpc SpawnActor(SpawnActorRequest) returns (SpawnActorResponse);
  rpc DeleteActor(DeleteActorRequest) returns (TempoScripting.Empty);
  rpc SetActorTransform(SetActorTransformRequest) returns (TempoScripting.Empty);
  rpc SetActorProperties(SetActorPropertiesRequest) returns (SetActorPropertiesResponse);

  //--- Property Path Operations ---
  rpc GetPropertyPath(GetPropertyPathRequest) returns (GetPropertyPathResponse);
  rpc SetPropertyPath(SetPropertyPathRequest) returns (TempoScripting.Empty);

  //--- Function Invocation ---
  rpc CallFunction(CallFunctionRequest) returns (CallFunctionResponse);

  //--- Type Discovery ---
  rpc FindClass(FindClassRequest) returns (FindClassResponse);
  rpc GetClassSchema(GetClassSchemaRequest) returns (GetClassSchemaResponse);
  rpc ListClasses(ListClassesRequest) returns (ListClassesResponse);

  //--- World Partition & Streaming ---
  rpc IsWorldPartitioned(IsWorldPartitionedRequest) returns (IsWorldPartitionedResponse);
  rpc QueryAllActors(QueryAllActorsRequest) returns (QueryAllActorsResponse);
  rpc GetStreamingState(GetStreamingStateRequest) returns (GetStreamingStateResponse);
  rpc QueryLandscape(QueryLandscapeRequest) returns (QueryLandscapeResponse);
  rpc GetLandscapeBounds(GetLandscapeBoundsRequest) returns (GetLandscapeBoundsResponse);
  rpc GetDataLayers(GetDataLayersRequest) returns (GetDataLayersResponse);
  rpc GetActorsInDataLayer(GetActorsInDataLayerRequest) returns (GetActorsInDataLayerResponse);

  //--- Console Commands (for arbitrary operations) ---
  rpc ExecuteConsoleCommand(ExecuteConsoleCommandRequest) returns (ExecuteConsoleCommandResponse);
  rpc SearchConsoleCommands(SearchConsoleCommandsRequest) returns (SearchConsoleCommandsResponse);

  //--- Asset Operations (P0) ---
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc SaveAsset(SaveAssetRequest) returns (SaveAssetResponse);
  rpc SaveActorAsBlueprint(SaveActorAsBlueprintRequest) returns (SaveActorAsBlueprintResponse);
  rpc DuplicateAsset(DuplicateAssetRequest) returns (DuplicateAssetResponse);
  rpc GetAssetThumbnail(GetAssetThumbnailRequest) returns (GetAssetThumbnailResponse);

  //--- Component Operations (P1) ---
  rpc GetComponentTransform(GetComponentTransformRequest) returns (GetComponentTransformResponse);
  rpc SetComponentTransform(SetComponentTransformRequest) returns (TempoScripting.Empty);
  rpc AttachComponent(AttachComponentRequest) returns (TempoScripting.Empty);
  rpc AttachActor(AttachActorRequest) returns (TempoScripting.Empty);
  rpc DetachComponent(DetachComponentRequest) returns (TempoScripting.Empty);
  rpc DetachActor(DetachActorRequest) returns (TempoScripting.Empty);

  //--- File Operations (P1) ---
  rpc ReadProjectFile(ReadProjectFileRequest) returns (ReadProjectFileResponse);
  rpc WriteProjectFile(WriteProjectFileRequest) returns (WriteProjectFileResponse);
  rpc ListProjectDirectory(ListProjectDirectoryRequest) returns (ListProjectDirectoryResponse);
  rpc CopyProjectFile(CopyProjectFileRequest) returns (CopyProjectFileResponse);
  rpc DeleteProjectFile(DeleteProjectFileRequest) returns (TempoScripting.Empty);
}
